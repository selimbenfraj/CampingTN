spring.application.name=CampingTunisia
server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/camping_tunisia
spring.data.mongodb.database=camping_tunisia
jwt.secret=camping-tunisia-super-secret-key-for-jwt-authentication-2024-secure
jwt.expiration=86400000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
ml.api.url=http://localhost:5000
logging.level.com.camping=DEBUG
