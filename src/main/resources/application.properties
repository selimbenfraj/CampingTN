# ??? Server ????????????????????????????????????????????????????????????????????
server.port=8080

# ??? H2 In-Memory Database (zero install needed) ???????????????????????????????
spring.datasource.url=jdbc:h2:mem:campingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console  ?  http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ??? JWT ????????????????????????????????????????????????????????????????????????
# Secret must be ?32 chars for HS256.  Change this in production!
jwt.secret=CampingTN-Super-Secret-Key-2024-ChangeMeInProd
# 24 hours in milliseconds
jwt.expiration=86400000

# ??? Disable MongoDB auto-configuration ?????????????????????????????????????????
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# ??? Logging ????????????????????????????????????????????????????????????????????
logging.level.com.camping=DEBUG
logging.level.org.springframework.security=INFO